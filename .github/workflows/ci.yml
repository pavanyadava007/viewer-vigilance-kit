name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --extra dev --frozen
      - name: ruff
        run: make lint
      - name: pytest
        run: make test
      - name: traceability
        run: .venv/bin/python scripts/traceability.py
